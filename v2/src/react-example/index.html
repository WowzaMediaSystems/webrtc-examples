<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      The theme is applied here, before anything paints.

      React sets the same attribute, but it can only do so after the bundle has loaded and
      mounted, by which time the page has already drawn one frame in whatever this element
      says. With "dark" hardcoded, a reader who had chosen light saw the page flash dark on
      every single load, which looks exactly like the choice not being remembered.

      The key is shared with src/hooks/useTheme.js; keep the two the same.
    -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('wz.theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark');
          document.documentElement.setAttribute('data-bs-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          // Storage can be blocked. The attribute above is the fallback, so there is
          // nothing to do here but carry on.
        }
      })();
    </script>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The only colour outside tokens.css, and it has to track --wz-bg in both themes or
         the browser chrome disagrees with the page. -->
    <meta name="theme-color" content="#0b141d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f7fa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Wowza WebRTC publish and playback example pages" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./logo192.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="manifest" href="./manifest.json" />
    <title>Wowza WebRTC Example Page</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
